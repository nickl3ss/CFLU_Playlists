<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CFLU WOD Builder — Tests</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Barlow+Condensed:wght@300;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d0d;--bg2:#141414;--bg3:#1a1a1a;--bg4:#222;--bg5:#2a2a2a;--acc:#1db954;--text:#fff;--text2:#b3b3b3;--text3:#535353;--border:#282828;--red:#f15e6c;--yellow:#f7c948;--green:#1db954}
body{font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--text);padding:32px;font-size:.8rem}
h1{font-family:'Barlow Condensed',sans-serif;font-size:1.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin-bottom:4px}
.subtitle{color:var(--text3);margin-bottom:28px;font-size:.72rem}
.summary{display:flex;gap:16px;margin-bottom:28px;padding:12px 16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;align-items:center}
.summary-num{font-size:1.4rem;font-weight:700}
.summary-num.pass{color:var(--green)}
.summary-num.fail{color:var(--red)}
.summary-label{font-size:.65rem;color:var(--text2);text-transform:uppercase;letter-spacing:.1em}
.suite{margin-bottom:20px}
.suite-name{font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:6px}
.suite-stats{font-size:.65rem;color:var(--text3);float:right;padding-top:2px}
.test{display:flex;gap:10px;align-items:baseline;padding:4px 8px;border-radius:4px;margin-bottom:2px}
.test:hover{background:var(--bg3)}
.test.pass .icon{color:var(--green)}
.test.fail{background:rgba(241,94,108,.06)}
.test.fail .icon{color:var(--red)}
.test-name{flex:1;color:var(--text2)}
.test.fail .test-name{color:var(--text)}
.test-err{font-size:.68rem;color:var(--red);margin-top:2px;padding-left:20px;padding-bottom:4px}
.badge{display:inline-block;font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:700;letter-spacing:.06em}
.badge.pass{background:rgba(29,185,84,.15);color:var(--green);border:1px solid rgba(29,185,84,.3)}
.badge.fail{background:rgba(241,94,108,.15);color:var(--red);border:1px solid rgba(241,94,108,.3)}
</style>
</head>
<body>
<h1>CFLU WOD Builder</h1>
<div class="subtitle">Test Suite — Alle Funktionen</div>
<div id="summary"></div>
<div id="output"></div>

<script>
if (window.location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('output').innerHTML =
      '<div style="padding:20px 24px;background:#1a0a00;border:1px solid #f7c948;border-radius:8px;margin-bottom:16px">' +
        '<div style="color:#f7c948;font-size:.9rem;font-weight:700;margin-bottom:10px">&#9888;&#65039; Kein HTTP-Server erkannt</div>' +
        '<div style="color:#b3b3b3;line-height:1.6;margin-bottom:12px">Die Tests verwenden ES-Module und ben&ouml;tigen einen HTTP-Server.<br>' +
        'Du hast die Datei direkt ge&ouml;ffnet (<span style="color:#f7c948;font-family:monospace">file://</span>) &mdash; das blockiert Imports.</div>' +
        '<div style="color:#b3b3b3;margin-bottom:6px"><strong style="color:#fff">L&ouml;sung:</strong></div>' +
        '<ol style="color:#b3b3b3;margin-left:20px;line-height:2.2">' +
          '<li>Starte <strong style="color:#fff">CFLU_Start.bat</strong> (startet HTTP-Server auf Port 8888)</li>' +
          '<li>Navigiere zu: <a href="http://127.0.0.1:8888/CFLU_Tests.html" style="color:#1db954">http://127.0.0.1:8888/CFLU_Tests.html</a></li>' +
        '</ol>' +
      '</div>';
  });
}
window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('output').innerHTML =
    '<pre style="color:#f15e6c;padding:20px;background:#1a0005;border-radius:6px">' +
    'Module-Fehler:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) + '</pre>';
});
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('output').innerHTML =
    '<pre style="color:#f15e6c;padding:20px;background:#1a0005;border-radius:6px">' +
    (err && err.stack ? err.stack : msg) + '</pre>';
};
</script>

<script type="module">
import { results } from './js/cflu_tests.js';

const { suites, totalPass, totalFail } = results;
const total = totalPass + totalFail;
const out = document.getElementById('output');

suites.forEach(suite => {
  const pass = suite.tests.filter(t => t.ok).length;
  const fail = suite.tests.filter(t => !t.ok).length;
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<div class="suite-name">${suite.name}<span class="suite-stats">${pass}/${suite.tests.length} bestanden</span></div>`;
  suite.tests.forEach(test => {
    const row = document.createElement('div');
    row.className = 'test ' + (test.ok ? 'pass' : 'fail');
    row.innerHTML = `<span class="icon">${test.ok ? '✓' : '✗'}</span><span class="test-name">${test.name}</span><span class="badge ${test.ok ? 'pass' : 'fail'}">${test.ok ? 'PASS' : 'FAIL'}</span>`;
    div.appendChild(row);
    if (!test.ok) { const err = document.createElement('div'); err.className = 'test-err'; err.textContent = test.err; div.appendChild(err); }
  });
  out.appendChild(div);
});

document.getElementById('summary').innerHTML = `
  <div class="summary">
    <div><div class="summary-num pass">${totalPass}</div><div class="summary-label">Bestanden</div></div>
    <div><div class="summary-num fail">${totalFail}</div><div class="summary-label">Fehlgeschlagen</div></div>
    <div><div class="summary-num" style="color:var(--text2)">${total}</div><div class="summary-label">Gesamt</div></div>
    <div style="margin-left:auto;align-self:center">
      <span class="badge ${totalFail === 0 ? 'pass' : 'fail'}" style="font-size:.8rem;padding:4px 12px">
        ${totalFail === 0 ? 'ALLE TESTS BESTANDEN' : 'FEHLER GEFUNDEN'}
      </span>
    </div>
  </div>`;
</script>
</body>
</html>
